[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-notifier"
version = "0.1.0"
description = "Send messages to Telegram chats easily."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "requests>=2.28",
]
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]


